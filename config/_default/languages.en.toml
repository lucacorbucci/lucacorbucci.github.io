bio = "Hi 👋! I'm Luca Corbucci, a Postdoctoral researcher at Fondazione Bruno Kessler (FBK) in Trento. My research focuses on <b>Multimodal Large Language Models</b>, with a focus on <b>SpeechLLMs</b>. Previously, I worked on <b>Privacy</b>, <b>Fairness</b>, and <b>Explainability</b> in Federated Learning during my PhD at the University of Pisa. <br> <br> <a href=\"/research/\">Read about my research</a> · <a href=\"/about-me/\">Read more about me</a>"
